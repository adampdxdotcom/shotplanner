server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large multi-megabyte project ZIP archives, 4K image uploads, and media files
    client_max_body_size 500M;

    # Include default MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. API proxy to FastAPI Backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 2. Uploaded user media files served from backend
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # 3. Static frontend assets built by Vite (JS, CSS, images)
    # Strictly served directly by Nginx from the compiled /dist output
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 4. SPA frontend routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
