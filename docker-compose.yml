services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: comfyui_bridge_backend
    ports:
      - "8000:8000"
    volumes:
      # Direct volume mount for assets (workflows and uploads)
      - ./assets:/app/assets
      # Live development code mount (optional)
      - ./backend:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
      - LM_STUDIO_DEFAULT_URL=http://127.0.0.1:1234/v1
    extra_hosts:
      # Enable docker container to connect to host's LM Studio (localhost:1234)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: comfyui_bridge_frontend
    ports:
      - "8302:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  assets:
