services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comfyui_bridge
    ports:
      - "8302:3000"
    volumes:
      - ./assets:/app/assets
    environment:
      - NODE_ENV=production
      - LM_STUDIO_DEFAULT_URL=http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  assets:

